name: Build and push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check secrets are visible to this workflow
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then echo "::error::DOCKERHUB_USERNAME is EMPTY or not visible to this workflow"; else echo "DOCKERHUB_USERNAME is set (length ${#DOCKERHUB_USERNAME})"; fi
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then echo "::error::DOCKERHUB_TOKEN is EMPTY or not visible to this workflow"; else echo "DOCKERHUB_TOKEN is set (length ${#DOCKERHUB_TOKEN})"; fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/myrelief-policy-assistant:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/myrelief-policy-assistant:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
